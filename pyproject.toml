[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsent"
version = "0.1.0"
description = "Financial sentiment analysis & cross-lingual transfer (EN -> FR/TN)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "mlflow>=2.14",
    "pyyaml>=6",
    "requests>=2.31",
    "ftfy>=6.1",
]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.44", "datasets>=2.20", "accelerate>=0.33", "evaluate>=0.4"]
translate = ["sentencepiece>=0.2", "unbabel-comet>=2.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
